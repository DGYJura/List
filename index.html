<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Турнірна Ліга</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Вітаємо у Турнірній Лізі</h1>
        
        <!-- Кнопки вибору ролі -->
        <div class="role-selector">
            <button class="btn active" onclick="showParticipantView()">Я Учасник</button>
            <button class="btn admin-btn" onclick="openAdminLogin()">Я Адмін</button>
        </div>

        <!-- Секція для учасників -->
        <div id="participantSection" class="card">
            <h2>Турнірна Таблиця</h2>
            <table id="leagueTable">
                <thead>
                    <tr>
                        <th>Команда</th>
                        <th>Ігри</th>
                        <th>Очки</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="3">Завантаження даних...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Модальне вікно для входу Адміна -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h3>Вхід для Адміністратора</h3>
            <input type="password" id="adminPassword" placeholder="Введіть пароль">
            <div class="modal-buttons">
                <button onclick="checkAdminPassword()">Увійти</button>
                <button class="cancel-btn" onclick="closeModal()">Скасувати</button>
            </div>
        </div>
    </div>

    <!-- Підключення Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ВСТАВТЕ СВІЙ FIREBASE CONFIG З КРОКУ 1
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Завантаження статистики в реальному часі
        database.ref('teams').on('value', (snapshot) => {
            const data = snapshot.val();
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            if (!data) {
                tableBody.innerHTML = '<tr><td colspan="3">Дані відсутні</td></tr>';
                return;
            }

            Object.values(data).forEach(team => {
                const row = `<tr>
                    <td>${team.name}</td>
                    <td>${team.played}</td>
                    <td><strong>${team.points}</strong></td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        });

        // Логіка модального вікна та пароля
        const ADMIN_PASS = "1234"; // Вкажіть свій пароль тут

        function openAdminLogin() {
            document.getElementById('loginModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('loginModal').style.display = 'none';
        }

        function checkAdminPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === ADMIN_PASS) {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                window.location.href = 'admin.html';
            } else {
                alert('Невірний пароль!');
            }
        }
    </script>
</body>
</html>
