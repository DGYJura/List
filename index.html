<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WFC Kit List & Contacts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght=400;500;700;900&display=swap');

        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --accent-blue: #0056b3;
            --text-main: #333333;
            --text-muted: #777777;
            --border-color: #eaeaea;
            --tg-color: #0088cc;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .header-wrapper {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 30px;
        }

        .header-section {
            text-align: center;
            max-width: 70%;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            padding-bottom: 10px;
            color: #111;
            border-bottom: 3px solid var(--accent-blue);
            display: inline-block;
            cursor: pointer;
        }

        .division-toggle {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 5px;
            background: #e2e8f0;
            padding: 4px;
            border-radius: 8px;
        }

        .div-btn {
            background: transparent;
            border: none;
            padding: 8px 16px;
            font-weight: 900;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #555;
        }

        .div-btn.active {
            background: var(--card-bg);
            color: var(--accent-blue);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .current-div-badge {
            font-size: 1rem;
            vertical-align: super;
            color: var(--accent-blue);
            margin-left: 5px;
            font-weight: 900;
        }

        .match-creator {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            box-sizing: border-box;
            display: none;
        }

        .creator-title {
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--accent-blue);
            letter-spacing: 0.5px;
        }

        .inputs-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 2;
            min-width: 150px;
        }

        .input-group label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        select, input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: 'Roboto', sans-serif;
            font-weight: 600;
            background: #f9f9f9;
            color: #333;
            outline: none;
            transition: 0.2s;
            box-sizing: border-box;
            width: 100%;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        thead {
            background-color: #fafafa;
            border-bottom: 2px solid var(--border-color);
        }

        th {
            padding: 15px 10px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 700;
        }

        td {
            padding: 15px 10px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            font-weight: 600;
        }

        .club-col { font-size: 1.1rem; font-weight: 700; text-align: left; padding-left: 25px; width: 35%; }
        .owner-col { color: #333; text-align: left; width: 30%; }
        .tg-col { text-align: left; width: 25%; }

        .tg-link {
            color: var(--tg-color);
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        button {
            background: white; color: #333; border: 1px solid #ccc; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; font-weight: 700; text-transform: uppercase; font-size: 0.85rem;
        }

        .btn-add { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; width: 100%; }
        .btn-delete { background: transparent; color: var(--text-muted); border: none; font-size: 1.2rem; display: none; }
        
        .action-header, .action-cell { display: none; }
    </style>
</head>
<body>

    <div class="header-wrapper">
        <div class="header-section">
            <!-- Клік по заголовку відкриє вікно пароля -->
            <h1 id="main-title" onclick="askAdminPassword()">WFC Kit List</h1>
            <span class="current-div-badge" id="div-badge">D1</span>
        </div>
        
        <div class="division-toggle">
            <button id="btn-d1" class="div-btn active" onclick="switchDivision('D1')">D1</button>
            <button id="btn-d2" class="div-btn" onclick="switchDivision('D2')">D2</button>
        </div>
    </div>

    <div class="match-creator" id="admin-panel">
        <div class="creator-title">Add / Update Club Contacts (Admin)</div>
        <div class="inputs-row">
            <div class="input-group">
                <label>Club Name</label>
                <select id="kit-club"></select>
            </div>
            <div class="input-group">
                <label>Manager Name</label>
                <input type="text" id="kit-owner" placeholder="Jura">
            </div>
            <div class="input-group">
                <label>Telegram</label>
                <input type="text" id="kit-tg" placeholder="@username">
            </div>
            <div>
                <button class="btn-add" onclick="addKitRecord()">Save</button>
            </div>
        </div>
    </div>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th style="text-align: left; padding-left: 25px;">Club</th>
                    <th style="text-align: left;">Manager / Owner</th>
                    <th style="text-align: left;">Telegram Contact</th>
                    <th class="action-header" id="th-action"></th>
                </tr>
            </thead>
            <tbody id="kits-body"></tbody>
        </table>
    </div>

    <script>
        let currentDivision = 'D1';
        let isAdmin = false;
        let kitsList = [];

        const defaultD1 = ["Black Knights", "Phoenix FC", "Noble Lions", "Horizon", "Wild Panthers", "United FC", "Albion", "Town Wanderers", "Vortex FC"];
        const defaultD2 = ["Нова Команда D2"];

        function askAdminPassword() {
            let pass = prompt("Введіть пароль адміністратора:");
            if (pass === "5555") {
                isAdmin = true;
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('th-action').style.display = 'table-cell';
                renderKits();
                alert("Ви увійшли як адмін!");
            } else {
                alert("Невірний пароль!");
            }
        }

        function updateTeamsDropdown() {
            const clubSelect = document.getElementById('kit-club');
            let teams = currentDivision === 'D1' ? defaultD1 : defaultD2;
            clubSelect.innerHTML = '<option value="">-- Select Club --</option>';
            teams.forEach(team => {
                let opt = document.createElement('option');
                opt.value = team; opt.innerText = team;
                clubSelect.appendChild(opt);
            });
        }

        function switchDivision(div) {
            currentDivision = div;
            document.getElementById('btn-d1').classList.toggle('active', div === 'D1');
            document.getElementById('btn-d2').classList.toggle('active', div === 'D2');
            document.getElementById('div-badge').innerText = div;
            updateTeamsDropdown();
            loadKits();
            renderKits();
        }

        function addKitRecord() {
            const clubVal = document.getElementById('kit-club').value;
            const ownerVal = document.getElementById('kit-owner').value.trim();
            let tgVal = document.getElementById('kit-tg').value.trim();

            if (!clubVal || !ownerVal) return alert("Заповніть поля!");

            let displayTg = tgVal || "Not Provided";
            let tgLink = tgVal ? `https://t.me/${tgVal.replace('@', '')}` : "";

            let newRecord = { id: Date.now(), club: clubVal, owner: ownerVal, tgDisplay: displayTg, tgUrl: tgLink };
            kitsList = kitsList.filter(k => k.club !== clubVal);
            kitsList.push(newRecord);
            kitsList.sort((a,b) => a.club.localeCompare(b.club));

            saveKits();
            renderKits();
        }

        function deleteKitRecord(id) {
            if(confirm("Видалити?")) {
                kitsList = kitsList.filter(k => k.id !== id);
                saveKits();
                renderKits();
            }
        }

        function renderKits() {
            const tbody = document.getElementById('kits-body');
            tbody.innerHTML = '';
            
            kitsList.forEach(record => {
                let tgCell = record.tgUrl ? `<a href="${record.tgUrl}" target="_blank" class="tg-link">${record.tgDisplay}</a>` : `<span>${record.tgDisplay}</span>`;
                let actionCell = isAdmin ? `<td style="display:table-cell;"><button onclick="deleteKitRecord(${record.id})">✕</button></td>` : '';
                
                tbody.innerHTML += `<tr>
                    <td class="club-col">${record.club}</td>
                    <td class="owner-col">${record.owner}</td>
                    <td class="tg-col">${tgCell}</td>
                    ${actionCell}
                </tr>`;
            });
        }

        function saveKits() { localStorage.setItem(`wfc_${currentDivision}`, JSON.stringify(kitsList)); }
        function loadKits() { kitsList = JSON.parse(localStorage.getItem(`wfc_${currentDivision}`)) || []; }

        updateTeamsDropdown();
        loadKits();
        renderKits();
    </script>
</body>
</html>
