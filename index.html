<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WFC Kit List & Contacts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght=400;500;700;900&display=swap');

        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --accent-blue: #0056b3;
            --text-main: #333333;
            --text-muted: #777777;
            --border-color: #eaeaea;
            --tg-color: #0088cc;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        /* Екран вибору ролі */
        .role-selection {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 100px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }

        .role-title {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 25px;
            color: #111;
        }

        .role-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid var(--accent-blue);
        }

        .btn-player { background: transparent; color: var(--accent-blue); }
        .btn-player:hover { background: rgba(0, 86, 179, 0.05); }
        .btn-owner { background: var(--accent-blue); color: white; }
        .btn-owner:hover { background: #004494; }

        /* Головний контент сайту (спочатку прихований) */
        .main-content {
            display: none;
            width: 100%;
            max-width: 900px;
        }

        .logout-section {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .btn-logout {
            background: #e2e8f0;
            border: none;
            color: #555;
            padding: 8px 16px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-logout:hover { background: #cbd5e1; }

        .header-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 30px;
        }

        .header-section {
            text-align: center;
            max-width: 70%;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            padding-bottom: 10px;
            color: #111;
            border-bottom: 3px solid var(--accent-blue);
            display: inline-block;
        }

        .division-toggle {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 5px;
            background: #e2e8f0;
            padding: 4px;
            border-radius: 8px;
        }

        .div-btn {
            background: transparent;
            border: none;
            padding: 8px 16px;
            font-weight: 900;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #555;
        }

        .div-btn.active {
            background: var(--card-bg);
            color: var(--accent-blue);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .current-div-badge {
            font-size: 1rem;
            vertical-align: super;
            color: var(--accent-blue);
            margin-left: 5px;
            font-weight: 900;
        }

        .match-creator {
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            box-sizing: border-box;
            display: none;
        }

        .creator-title {
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--accent-blue);
            letter-spacing: 0.5px;
        }

        .inputs-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 2;
            min-width: 150px;
        }

        .input-group label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: 'Roboto', sans-serif;
            font-weight: 600;
            background: #f9f9f9;
            color: #333;
            outline: none;
            transition: 0.2s;
            box-sizing: border-box;
            width: 100%;
        }

        .container {
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        thead {
            background-color: #fafafa;
            border-bottom: 2px solid var(--border-color);
        }

        th {
            padding: 15px 10px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 700;
        }

        td {
            padding: 15px 10px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            font-weight: 600;
        }

        .club-col { font-size: 1.1rem; font-weight: 700; text-align: left; padding-left: 25px; width: 35%; color: #111; }
        .owner-col { color: #333; text-align: left; width: 30%; }
        .tg-col { text-align: left; width: 25%; }

        .tg-link {
            color: #ffffff;
            background-color: var(--tg-color);
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            transition: background-color 0.2s;
        }

        .tg-link:hover {
            background-color: #0077b3;
        }

        .tg-icon {
            font-size: 0.95rem;
        }

        button {
            background: white; color: #333; border: 1px solid #ccc; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; font-weight: 700; text-transform: uppercase; font-size: 0.85rem;
        }

        .btn-add { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; width: 100%; }
        .btn-add:hover { background: #004494; }
        .btn-delete { background: transparent; color: #cc0000; border: none; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

    <div class="role-selection" id="role-screen">
        <div class="role-title">Select Your Role</div>
        <button class="role-btn btn-player" onclick="selectRole('player')">Player</button>
        <button class="role-btn btn-owner" onclick="selectRole('owner')">Owner / Admin</button>
    </div>

    <div class="main-content" id="main-content">
        
        <div class="logout-section">
            <button class="btn-logout" onclick="logout()">← Change Role / Log Out</button>
        </div>

        <div class="header-wrapper">
            <div class="header-section">
                <h1 id="main-title">WFC Kit List</h1>
                <span class="current-div-badge" id="div-badge">D1</span>
            </div>
            
            <div class="division-toggle">
                <button id="btn-d1" class="div-btn active" onclick="switchDivision('D1')">D1</button>
                <button id="btn-d2" class="div-btn" onclick="switchDivision('D2')">D2</button>
            </div>
        </div>

        <div class="match-creator" id="admin-panel">
            <div class="creator-title">Add / Update Club Contacts (Admin Mode)</div>
            <div class="inputs-row">
                <div class="input-group">
                    <label>Club Name</label>
                    <input type="text" id="kit-club" placeholder="e.g. Black Knights">
                </div>
                <div class="input-group">
                    <label>Manager Name</label>
                    <input type="text" id="kit-owner" placeholder="e.g. Jura">
                </div>
                <div class="input-group">
                    <label>Telegram Username</label>
                    <input type="text" id="kit-tg" placeholder="e.g. @Yura_053">
                </div>
                <div>
                    <button class="btn-add" onclick="addKitRecord()">Save</button>
                </div>
            </div>
        </div>

        <div class="container">
            <table>
                <thead>
                    <tr>
                        <th style="text-align: left; padding-left: 25px;">Club</th>
                        <th style="text-align: left;">Manager / Owner</th>
                        <th style="text-align: left;">Telegram Contact</th>
                        <th id="th-action" style="display: none; width: 50px;"></th>
                    </tr>
                </thead>
                <tbody id="kits-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        let currentDivision = 'D1';
        let isAdmin = false;
        let kitsList = [];

        function selectRole(role) {
            if (role === 'owner') {
                let pass = prompt("Enter Admin Password:");
                if (pass === "5555") {
                    isAdmin = true;
                    document.getElementById('admin-panel').style.display = 'block';
                    document.getElementById('th-action').style.display = 'table-cell';
                } else {
                    alert("Wrong password!");
                    return;
                }
            } else {
                isAdmin = false;
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('th-action').style.display = 'none';
            }

            document.getElementById('role-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            
            loadKits();
            renderKits();
        }

        function logout() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('role-screen').style.display = 'block';
        }

        function switchDivision(div) {
            currentDivision = div;
            document.getElementById('btn-d1').classList.toggle('active', div === 'D1');
            document.getElementById('btn-d2').classList.toggle('active', div === 'D2');
            document.getElementById('div-badge').innerText = div;
            
            loadKits();
            renderKits();
        }

        function addKitRecord() {
            const clubInput = document.getElementById('kit-club');
            const ownerInput = document.getElementById('kit-owner');
            const tgInput = document.getElementById('kit-tg');

            const clubVal = clubInput.value.trim();
            const ownerVal = ownerInput.value.trim();
            let tgVal = tgInput.value.trim();

            if (!clubVal || !ownerVal) {
                alert("Please enter both Club Name and Manager Name!");
                return;
            }

            let displayTg = tgVal || "Not Provided";
            // Автоматично прибираємо @ з посилання, якщо користувач його ввів
            let cleanTg = tgVal.replace('@', '');
            let tgLink = tgVal ? `https://t.me/${cleanTg}` : "";

            let newRecord = { 
                id: Date.now(), 
                club: clubVal, 
                owner: ownerVal, 
                tgDisplay: displayTg.startsWith('@') ? displayTg : (tgVal ? '@' + displayTg : displayTg), 
                tgUrl: tgLink 
            };

            // Якщо клуб з такою назвою вже є у списку цієї ліги — оновлюємо його
            kitsList = kitsList.filter(k => k.club.toLowerCase() !== clubVal.toLowerCase());
            kitsList.push(newRecord);
            
            // Сортування за алфавітом назв клубів
            kitsList.sort((a,b) => a.club.localeCompare(b.club));

            saveKits();
            renderKits();

            // Очищення полів форми
            clubInput.value = "";
            ownerInput.value = "";
            tgInput.value = "";
        }

        function deleteKitRecord(id) {
            if(confirm("Delete this contact?")) {
                kitsList = kitsList.filter(k => k.id !== id);
                saveKits();
                renderKits();
            }
        }

        function renderKits() {
            const tbody = document.getElementById('kits-body');
            if (!tbody) return;
            tbody.innerHTML = '';
            
            if(kitsList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${isAdmin ? 4 : 3}" style="color: var(--text-muted); padding: 30px;">No contacts added yet for ${currentDivision}</td></tr>`;
                return;
            }

            kitsList.forEach(record => {
                // Додаємо красиву кнопку з літачком Телеграму (✈)
                let tgCell = record.tgUrl ? `<a href="${record.tgUrl}" target="_blank" class="tg-link"><span class="tg-icon">✈</span> ${record.tgDisplay}</a>` : `<span style="color: var(--text-muted); font-style: italic;">${record.tgDisplay}</span>`;
                let actionCell = isAdmin ? `<td style="text-align: center;"><button class="btn-delete" onclick="deleteKitRecord(${record.id})">✕</button></td>` : '';
                
                tbody.innerHTML += `<tr>
                    <td class="club-col">${record.club}</td>
                    <td class="owner-col">${record.owner}</td>
                    <td class="tg-col">${tgCell}</td>
                    ${actionCell}
                </tr>`;
            });
        }

        function saveKits() { 
            localStorage.setItem(`wfc_v2_${currentDivision}`, JSON.stringify(kitsList)); 
        }
        
        function loadKits() { 
            kitsList = JSON.parse(localStorage.getItem(`wfc_v2_${currentDivision}`)) || []; 
        }
    </script>
</body>
</html>
